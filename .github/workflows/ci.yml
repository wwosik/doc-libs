# Build, test and pack on every push to main and every pull request. Publishing is release.yml.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  SOLUTION: src/wwosik.DocLibs.slnx
  DOTNET_NOLOGO: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore $SOLUTION
      - run: dotnet build $SOLUTION --configuration Release --no-restore
      # The WindowsOnly tests skip themselves here: they need Windows with Word and Excel.
      - run: dotnet test $SOLUTION --configuration Release --no-build
      - run: dotnet pack $SOLUTION --configuration Release --no-build --output artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/
